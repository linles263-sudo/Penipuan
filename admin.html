<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Hokage</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #fff; padding: 10px; }
        h1 { color: #00ff88; text-align: center; }
    .tab { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab button { flex: 1; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .tab.active { background: #00ff88; color: #000; }
    .tab.inactive { background: #333; color: #fff; }
    .laporan { background: #222; border: 1px solid #444; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .laporan div { margin: 6px 0; }
    .nomor { font-size: 20px; color: #ff4444; font-weight: bold; }
    .label { color: #00ff88; font-weight: bold; }
    .kronologi { margin: 10px 0; color: #ccc; }
        img { max-width: 100%; border-radius: 5px; margin-top: 10px; border: 2px solid #00ff88; }
        button { padding: 10px 15px; border: none; border-radius: 5px; font-weight: bold; margin-right: 10px; cursor: pointer; }
    .acc { background: #00ff88; color: #000; }
    .tolak { background: #ff4444; color: #fff; }
    .loading { text-align: center; font-size: 18px; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; background: #444; }
    .verified { border-left: 4px solid #00ff88; }
    .pending { border-left: 4px solid #ffaa00; }
    </style>
</head>
<body>
    <h1>🛡️ DASHBOARD HOKAGE 🛡️</h1>

    <div class="tab">
        <button id="tabPending" class="active" onclick="gantiTab('pending')">⏳ PENDING</button>
        <button id="tabSemua" class="inactive" onclick="gantiTab('semua')">📋 SEMUA LAPORAN</button>
    </div>

    <div id="list-laporan" class="loading">Loading laporan...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDymhDdWpz17nJWrqbXc6djpRbNtg5pjb4",
            authDomain: "cekpenipuan-f1c13.firebaseapp.com",
            databaseURL: "https://cekpenipuan-f1c13-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "cekpenipuan-f1c13",
            storageBucket: "cekpenipuan-f1c13.firebasestorage.app",
            messagingSenderId: "678145277685",
            appId: "1:678145277685:web:7117058bab91e1cf2e4fbc",
            measurementId: "G-G2P66VENMC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const listLaporan = document.getElementById('list-laporan');
        let modeTab = 'pending';

        const passwordAsli = "hokage2026";
        const password = prompt("Masukin Password Hokage:");
        if (password!== passwordAsli) {
            alert("Lu bukan Hokage! Akses ditolak.");
            document.body.innerHTML = "<h1 style='color:#ff4444;text-align:center;margin-top:50px'>AKSES DITOLAK</h1>";
            throw new Error("Password salah");
        }

        window.gantiTab = function(tab) {
            modeTab = tab;
            document.getElementById('tabPending').className = tab === 'pending'? 'active' : 'inactive';
            document.getElementById('tabSemua').className = tab === 'semua'? 'active' : 'inactive';
            loadLaporan();
        }

        function loadLaporan() {
            const laporanRef = ref(db, 'laporan');
            onValue(laporanRef, (snapshot) => {
                listLaporan.innerHTML = '';
                let adaData = false;

                snapshot.forEach((data) => {
                    const key = data.key;
                    const laporan = data.val();

                    // Filter sesuai tab
                    if (modeTab === 'pending' && laporan.status!== 'pending') return;
                    if (modeTab === 'semua' &&!laporan.status) return;

                    adaData = true;
                    let fotoHTML = '<i>Tidak ada bukti foto</i>';
                    if (laporan.bukti && laporan.bukti[0]) {
                        fotoHTML = `<img src="${laporan.bukti[0]}" alt="Bukti Chat" loading="lazy">`;
                    }

                    const div = document.createElement('div');
                    div.className = `laporan ${laporan.status}`;
                    div.innerHTML = `
                        <div class="nomor">📱 ${laporan.rekening || laporan.nomor || 'Nomor/Rek kosong'}</div>
                        <div><span class="label">Status:</span> <span class="badge">${laporan.status.toUpperCase()}</span></div>
                        <div><span class="label">Kategori:</span> <span class="badge">${laporan.kategori || '-'}</span></div>
                        <div><span class="label">Platform:</span> ${laporan.namaPlatform || laporan.platform || laporan.bank || '-'}</div>
                        <div><span class="label">No HP / Rekening:</span> ${laporan.rekening || laporan.nomor || '-'}</div>
                        <div class="kronologi"><span class="label">Kronologi:</span> ${laporan.kronologi || '-'}</div>
                        <div><span class="label">Waktu Lapor:</span> ${laporan.waktu? new Date(laporan.waktu).toLocaleString('id-ID') : '-'}</div>
                        <div><span class="label">Bukti Chat:</span><br>${fotoHTML}</div>
                        <br>
                        ${laporan.status === 'pending'? `
                            <button class="acc" onclick="updateStatus('${key}', 'verified')">✅ ACC JADI VERIFIED</button>
                            <button class="tolak" onclick="hapusLaporan('${key}')">❌ TOLAK/HAPUS</button>
                        ` : `
                            <button class="tolak" onclick="hapusLaporan('${key}')">🗑️ HAPUS DARI DATABASE</button>
                        `}
                    `;
                    listLaporan.appendChild(div);
                });

                if (!adaData) {
                    listLaporan.innerHTML = `<p class="loading">${modeTab === 'pending'? '✅ Semua laporan udah di-ACC' : '📭 Belum ada laporan masuk'}</p>`;
                }
            });
        }

        window.updateStatus = function(key, statusBaru) {
            if (confirm('Yakin mau ACC laporan ini jadi VERIFIED?')) {
                update(ref(db, 'laporan/' + key), { status: statusBaru });
                alert('Berhasil di-ACC! Auto masuk web utama.');
            }
        }

        window.hapusLaporan = function(key) {
            if (confirm('Yakin mau HAPUS laporan ini? Data hilang permanen.')) {
                remove(ref(db, 'laporan/' + key));
                alert('Laporan berhasil dihapus.');
            }
        }

        loadLaporan();
    </script>
</body>
    </html>
