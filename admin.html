<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Hokage V3 - No Delete</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #fff; padding: 10px; }
        h1 { color: #00ff88; text-align: center; }
.tab { display: flex; gap: 10px; margin-bottom: 15px; }
.tab button { flex: 1; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
.tab.active { background: #00ff88; color: #000; }
.tab.inactive { background: #333; color: #fff; }
.export-bar { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
.export-bar select { flex:1; padding:12px; border:none; border-radius:5px; font-weight:bold; background:#333; color:#fff; }
.btn-wrap { display: flex; gap: 10px; flex-wrap: wrap; }
.export-bar button { flex:1; padding:12px; border:none; border-radius:5px; font-weight:bold; cursor:pointer; min-width: 120px; }
.btn-excel { background:#00ff88; color:#000; }
.btn-pdf { background:#ff4444; color:#fff; }
.btn-email { background:#0088ff; color:#fff; }
.laporan {
             background: #222;
             border: 1px solid #444;
             border-radius: 8px;
             padding: 15px;
             margin-bottom: 15px;
             text-align: left;
         }
.laporan.row {
             display: flex;
             margin: 8px 0;
             align-items: flex-start;
         }
.laporan.label {
             color: #00ff88;
             font-weight: bold;
             min-width: 140px;
             flex-shrink: 0;
         }
.laporan.value {
             color: #fff;
             flex: 1;
             word-break: break-word;
         }
.nomor {
             font-size: 22px;
             color: #ff4444;
             font-weight: bold;
             text-align: center;
             margin-bottom: 12px;
             padding-bottom: 10px;
             border-bottom: 1px solid #444;
         }
.kronologi {
             margin: 10px 0;
             color: #ccc;
             background: #1a1a1a;
             padding: 10px;
             border-radius: 5px;
             border-left: 3px solid #00ff88;
         }
        img { max-width: 100%; border-radius: 5px; margin-top: 10px; border: 2px solid #00ff88; }
        button { padding: 10px 15px; border: none; border-radius: 5px; font-weight: bold; margin-right: 10px; cursor: pointer; }
.acc { background: #00ff88; color: #000; }
.tolak { background: #ff4444; color: #fff; }
.loading { text-align: center; font-size: 18px; }
.badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; background: #444; }
.verified { border-left: 4px solid #00ff88; }
.pending { border-left: 4px solid #ffaa00; }
.rejected { border-left: 4px solid #ff4444; }
.alasan-box { width: 100%; padding: 8px; margin: 10px 0; background: #333; color: #fff; border: 1px solid #555; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>🛡️ DASHBOARD HOKAGE V3 🛡️</h1>

    <!-- FILTER + EXPORT BAR UPGRADE -->
    <div class="export-bar">
        <select id="filterPlatform">
            <option value="semua">📋 Export Semua Platform</option>
            <option value="---">--- E-WALLET ---</option>
            <option value="GoPay">🟢 Export GoPay Saja</option>
            <option value="DANA">🔵 Export DANA Saja</option>
            <option value="ShopeePay">🟠 Export ShopeePay Saja</option>
            <option value="OVO">💜 Export OVO Saja</option>
            <option value="LinkAja">🔴 Export LinkAja Saja</option>
            <option value="---">--- BANK UMUM ---</option>
            <option value="Bank">🏦 Export Semua Bank</option>
            <option value="Bank BNI">🏛️ Export BNI Saja</option>
            <option value="Bank BRI">🏛️ Export BRI Saja</option>
            <option value="Bank Mandiri">🏛️ Export Mandiri Saja</option>
            <option value="Bank BCA">🏛️ Export BCA Saja</option>
            <option value="SeaBank">🏛️ Export SeaBank Saja</option>
            <option value="Bank CIMB">🏛️ Export CIMB Niaga Saja</option>
            <option value="Bank BSI">🏛️ Export BSI Saja</option>
            <option value="Bank BTN">🏛️ Export BTN Saja</option>
            <option value="Bank Permata">🏛️ Export Permata Saja</option>
            <option value="Bank Danamon">🏛️ Export Danamon Saja</option>
        </select>
        <div class="btn-wrap">
            <button class="btn-excel" onclick="downloadExcel()">📥 EXCEL</button>
            <button class="btn-pdf" onclick="downloadPDF()">📄 PDF</button>
            <button class="btn-email" onclick="kirimEmailBank()">📧 EMAIL 1-KLIK</button>
        </div>
    </div>

    <div class="tab">
        <button id="tabPending" class="active" onclick="gantiTab('pending')">⏳ PENDING</button>
        <button id="tabSemua" class="inactive" onclick="gantiTab('semua')">📋 SEMUA LAPORAN</button>
    </div>

    <div id="list-laporan" class="loading">Loading laporan...</div>

    <!-- LIBRARY EXPORT -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDymhDdWpz17nJWrqbXc6djpRbNtg5pjb4",
            authDomain: "cekpenipuan-f1c13.firebaseapp.com",
            databaseURL: "https://cekpenipuan-f1c13-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "cekpenipuan-f1c13",
            storageBucket: "cekpenipuan-f1c13.firebasestorage.app",
            messagingSenderId: "678145277685",
            appId: "1:678145277685:web:7117058bab91e1cf2e4fbc",
            measurementId: "G-G2P66VENMC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const listLaporan = document.getElementById('list-laporan');
        let modeTab = 'pending';
        let semuaDataLaporan = [];

        const passwordAsli = "hokage2026";
        const password = prompt("Masukin Password Hokage:");
        if (password!== passwordAsli) {
            alert("Lu bukan Hokage! Akses ditolak.");
            document.body.innerHTML = "<h1 style='color:#ff4444;text-align:center;margin-top:50px'>AKSES DITOLAK</h1>";
            throw new Error("Password salah");
        }

        const EMAIL_BANK = {
            'Bank BNI': 'bnicall@bni.co.id',
            'Bank BRI': 'callbri@bri.co.id',
            'Bank Mandiri': 'mandiricare@bankmandiri.co.id',
            'Bank BCA': 'halobca@bca.co.id',
            'SeaBank': 'cs@seabank.co.id',
            'Bank CIMB': '14041@cimbniaga.co.id',
            'Bank BSI': 'contactus@bankbsi.co.id',
            'Bank BTN': 'btncontactcenter@btn.co.id',
            'Bank Permata': 'care@permatabank.co.id',
            'Bank Danamon': 'hellodanamon@danamon.co.id',
            'DANA': 'help@dana.id',
            'GoPay': 'customerservice@gojek.com',
            'OVO': 'cs@ovo.id',
            'ShopeePay': 'help@support.shopee.co.id',
            'LinkAja': 'info@linkaja.id'
        };

        window.gantiTab = function(tab) {
            modeTab = tab;
            document.getElementById('tabPending').className = tab === 'pending'? 'active' : 'inactive';
            document.getElementById('tabSemua').className = tab === 'semua'? 'active' : 'inactive';
            loadLaporan();
        }

        function loadLaporan() {
            const laporanRef = ref(db, 'laporan');
            onValue(laporanRef, (snapshot) => {
                listLaporan.innerHTML = '';
                semuaDataLaporan = [];
                let adaData = false;

                snapshot.forEach((data) => {
                    const key = data.key;
                    const laporan = data.val();
                    semuaDataLaporan.push({...laporan, id: key});

                    if (modeTab === 'pending' && laporan.status!== 'pending') return;
                    if (modeTab === 'semua' &&!laporan.status) return;

                    adaData = true;
                    let fotoHTML = '<i>Tidak ada bukti foto</i>';
                    if (laporan.bukti && laporan.bukti.length > 0) {
                        fotoHTML = laporan.bukti.map(url => `<img src="${url}" alt="Bukti Chat" loading="lazy">`).join('');
                    }

                    const div = document.createElement('div');
                    div.className = `laporan ${laporan.status}`;
                    div.innerHTML = `
                        <div class="nomor">📱 ${laporan.rekening || laporan.nomor || 'Nomor/Rek kosong'}</div>
                        <div class="row"><span class="label">Status:</span> <span class="value"><span class="badge">${(laporan.status || 'verified').toUpperCase()}</span></span></div>
                        <div class="row"><span class="label">Kategori:</span> <span class="value"><span class="badge">${laporan.kategori || 'Lainnya'}</span></span></div>
                        <div class="row"><span class="label">Platform:</span> <span class="value">${laporan.jenis || laporan.namaPlatform || laporan.platform || laporan.bank || '-'}</span></div>
                        <div class="row"><span class="label">No HP / Rekening:</span> <span class="value">${laporan.rekening || laporan.nomor || '-'}</span></div>
                        <div class="row"><span class="label">Kronologi:</span> <span class="value">${laporan.kronologi || '-'}</span></div>
                        <div class="row"><span class="label">Pelapor:</span> <span class="value">${laporan.pelapor || 'Anonim'}</span></div>
                        <div class="row"><span class="label">Waktu Lapor:</span> <span class="value">${laporan.waktu? new Date(laporan.waktu).toLocaleString('id-ID') : '-'}</span></div>
                        ${laporan.status === 'rejected'? `<div class="row"><span class="label">Alasan Tolak:</span> <span class="value" style="color:#ff4444">${laporan.alasan_tolak || '-'}</span></div>` : ''}
                        <div class="row"><span class="label">Bukti Chat:</span></div>
                        ${fotoHTML}
                        <br>
                        ${laporan.status === 'pending'? `
                            <button class="acc" onclick="updateStatus('${key}', 'verified')">✅ ACC JADI VERIFIED</button>
                            <input type="text" class="alasan-box" id="alasan_${key}" placeholder="Alasan tolak: Bukti kurang jelas / Duplikat">
                            <button class="tolak" onclick="tolakLaporan('${key}')">❌ TOLAK LAPORAN</button>
                        ` : laporan.status === 'verified'? `
                            <input type="text" class="alasan-box" id="alasan_${key}" placeholder="Alasan tolak: Laporan palsu">
                            <button class="tolak" onclick="tolakLaporan('${key}')">❌ UBAH JADI DITOLAK</button>
                        ` : `
                            <span style="color:#ff4444">Laporan sudah ditolak</span>
                        `}
                    `;
                    listLaporan.appendChild(div);
                });

                if (!adaData) {
                    listLaporan.innerHTML = `<p class="loading">${modeTab === 'pending'? '✅ Semua laporan udah di-ACC' : '📭 Belum ada laporan masuk'}</p>`;
                }
            });
        }

        window.updateStatus = function(key, statusBaru) {
            if (confirm('Yakin mau ACC laporan ini jadi VERIFIED?')) {
                update(ref(db, 'laporan/' + key), { status: statusBaru });
                alert('Berhasil di-ACC! Auto masuk web utama.');
            }
        }

        // GANTI HAPUS JADI TOLAK - V3.0
        window.tolakLaporan = function(key) {
            const alasan = document.getElementById('alasan_' + key).value.trim() || 'Ditolak admin';
            if (confirm(`Yakin mau TOLAK laporan ini?\nAlasan: ${alasan}\n\nData ga dihapus, user bisa liat status DITOLAK.`)) {
                update(ref(db, 'laporan/' + key), {
                    status: 'rejected',
                    alasan_tolak: alasan
                });
                alert('Laporan berhasil ditolak. User bisa liat alasannya di Cek Status.');
            }
        }

        function getFilteredData() {
            const filterValue = document.getElementById('filterPlatform').value;

            let dataFilter = semuaDataLaporan.filter(l => {
                if (modeTab === 'pending') return l.status === 'pending';
                return true;
            });

            if (filterValue!== 'semua' && filterValue!== '---') {
                dataFilter = dataFilter.filter(l => {
                    const platform = (l.jenis || l.namaPlatform || l.platform || l.bank || '').toLowerCase();
                    const filter = filterValue.toLowerCase();

                    if (filterValue === 'Bank') {
                        return platform.includes('bank') || platform.includes('bca') || platform.includes('bri') ||
                               platform.includes('mandiri') || platform.includes('bni') || platform.includes('seabank') ||
                               platform.includes('cimb') || platform.includes('bsi') || platform.includes('btn') ||
                               platform.includes('permata') || platform.includes('danamon');
                    }
                    return platform.includes(filter);
                });
            }
            return { dataFilter, filterValue };
        }

        window.kirimEmailBank = function() {
            const { dataFilter, filterValue } = getFilteredData();
            if(filterValue === 'semua' || filterValue === '---' || filterValue === 'Bank') {
                return alert('Pilih bank/e-wallet spesifik dulu Prof! Jangan "Semua Bank"');
            }
            if(dataFilter.length === 0) return alert(`Data ${filterValue} kosong Prof!`);

            const to = EMAIL_BANK[filterValue] || 'cs@bank.co.id';
            const norek = dataFilter.map(l => l.rekening || l.nomor).join(', ');
            const totalRugi = dataFilter.length;
            const subject = `[URGENT] BLOKIR ${totalRugi} REKENING ${filterValue} - INDIKASI PENIPUAN`;
            const body = `Yth. Tim Fraud ${filterValue},

Mohon URGENT pemblokiran ${totalRugi} rekening terindikasi penipuan:
${norek}

Bukti lengkap sudah kami download via PDF dari sistem.
Sumber: Satpam Digital Indonesia - https://linles263-sudo.github.io/Penipuan

Sesuai PM Kominfo No.5/2020 & SE OJK No.6/SEOJK.07/2022,
mohon blokir 1x24 jam untuk mencegah korban baru.

Laporan ini kami CC ke OJK RI untuk monitoring.

Hormat kami,
Satpam Digital Indonesia`;

            window.open(`mailto:${to}?cc=konsumen@ojk.go.id&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`);
            alert(`Email ke ${filterValue} siap dikirim! Tinggal lampirin PDF yg baru lu download.`);
        }

        window.downloadExcel = function() {
            const { dataFilter, filterValue } = getFilteredData();
            if(dataFilter.length === 0) return alert(`Data ${filterValue} kosong Prof!`);

            const dataExport = dataFilter.map(l => ({
                'Status': l.status || 'verified',
                'Kategori': l.kategori || l.jenis || l.platform || l.bank || 'Lainnya',
                'Platform': l.jenis || l.namaPlatform || l.platform || l.bank || '-',
                'Nomor/Rekening': l.rekening || l.nomor || '-',
                'Pelapor': l.pelapor || 'Anonim',
                'Kronologi': l.kronologi || '-',
                'Waktu Lapor': l.waktu? new Date(l.waktu).toLocaleString('id-ID') : '-',
                'Jumlah Bukti': l.bukti? l.bukti.length : 0,
                'Alasan Tolak': l.alasan_tolak || '-',
                'ID Laporan': l.id
            }));

            const ws = XLSX.utils.json_to_sheet(dataExport);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Data Penipu");
            const tgl = new Date().toLocaleDateString('id-ID').replace(/\//g, '-');
            const namaFile = filterValue.replace(/ /g, '_');
            XLSX.writeFile(wb, `Laporan_${namaFile}_${modeTab}_${tgl}.xlsx`);
            alert(`Excel ${filterValue} berhasil di download! Total: ${dataFilter.length} data`);
        }

        window.downloadPDF = async function() {
            const { dataFilter, filterValue } = getFilteredData();
            if(dataFilter.length === 0) return alert(`Data ${filterValue} kosong Prof!`);

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const tgl = new Date().toLocaleString('id-ID');

            doc.setFontSize(16);
            doc.text(`LAPORAN SATPAM DIGITAL - ${filterValue.toUpperCase()}`, 14, 20);
            doc.setFontSize(10);
            doc.text(`Tab: ${modeTab.toUpperCase()} | Total: ${dataFilter.length} Laporan | https://linles263-sudo.github.io/Penipuan`, 14, 28);
            doc.text(`Dicetak: ${tgl}`, 14, 34);

            let y = 45;

            for (let i = 0; i < dataFilter.length; i++) {
                const l = dataFilter[i];
                if (y > 250) { doc.addPage(); y = 20; }

                const nomor = l.rekening || l.nomor || '-';
                const platform = l.jenis || l.namaPlatform || l.platform || l.bank || 'Tidak diketahui';
                const status = l.status || 'verified';
                const kategori = l.kategori || platform;
                const pelapor = l.pelapor || 'Anonim';
                const waktu = l.waktu? new Date(l.waktu).toLocaleDateString('id-ID') : '-';

                doc.setFontSize(11);
                doc.setTextColor(255, 68, 68);
                doc.text(`${i+1}. ${nomor}`, 14, y);
                doc.setTextColor(0, 0, 0);
                doc.setFontSize(9);
                doc.text(` Status: ${status.toUpperCase()} | Kategori: ${kategori} | Platform: ${platform}`, 14, y+5);
                doc.text(` Pelapor: ${pelapor} | Waktu: ${waktu}`, 14, y+10);
                if (l.alasan_tolak) {
                    doc.setTextColor(255, 68, 68);
                    doc.text(` Alasan Tolak: ${l.alasan_tolak}`, 14, y+15);
                    doc.setTextColor(0, 0, 0);
                    y += 5;
                }
                const kronologi = doc.splitTextToSize(` Kronologi: ${l.kronologi || '-'}`, 180);
                doc.text(kronologi, 14, y+15);
                y += 15 + (kronologi.length * 4);

                if (l.bukti && l.bukti.length > 0) {
                    doc.setFontSize(9);
                    doc.setTextColor(0, 255, 136);
                    doc.text(`Bukti Transfer (${l.bukti.length} foto):`, 14, y);
                    doc.setTextColor(0, 0, 0);
                    y += 6;

                    const maxImgHeight = 85;
                    const colWidth = 88;
                    const gap = 4;
                    let col = 0;

                    for (let j = 0; j < l.bukti.length; j++) {
                        try {
                            const imgUrl = l.bukti[j];
                            const imgRes = await fetch(imgUrl);
                            const imgBlob = await imgRes.blob();
                            const imgBase64 = await blobToBase64(imgBlob);

                            const imgProps = await getImageProperties(imgBase64);
                            let imgWidth = colWidth;
                            let imgHeight = (imgProps.height * imgWidth) / imgProps.width;

                            if (imgHeight > maxImgHeight) {
                                imgHeight = maxImgHeight;
                                imgWidth = (imgProps.width * maxImgHeight) / imgProps.height;
                            }

                            const xPos = 14 + (col * (colWidth + gap));

                            if (y + maxImgHeight > 285) {
                                doc.addPage();
                                y = 20;
                                col = 0;
                            }

                            doc.setFontSize(7);
                            doc.setTextColor(100, 100, 100);
                            doc.text(`Bukti ${j + 1}`, xPos, y);

                            doc.setDrawColor(200, 200, 200);
                            doc.rect(xPos, y + 1, colWidth, maxImgHeight);

                            doc.addImage(imgBase64, 'PNG', xPos + 1, y + 2, imgWidth - 2, imgHeight - 2);

                            if (col === 0 && j < l.bukti.length - 1) {
                                col = 1;
                            } else {
                                col = 0;
                                y += maxImgHeight + 8;
                            }

                        } catch (err) {
                            doc.setFontSize(7);
                            doc.text(`Bukti ${j + 1}: Error`, 14 + (col * (colWidth + gap)), y);
                            if (col === 1 || j === l.bukti.length - 1) y += 15;
                            col = col === 0? 1 : 0;
                        }
                    }
                    if (col === 1) y += maxImgHeight + 8;
                }
                y += 5;
                doc.setDrawColor(200, 200, 200);
                doc.line(14, y, 196, y);
                y += 5;
            }

            const tglFile = new Date().toLocaleDateString('id-ID').replace(/\//g, '-');
            const namaFile = filterValue.replace(/ /g, '_');
            doc.save(`Laporan_${namaFile}_${modeTab}_${tglFile}.pdf`);
            alert(`PDF ${filterValue} berhasil di download! Total: ${dataFilter.length} data`);
        }

        function blobToBase64(blob) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.readAsDataURL(blob);
            });
        }

        function getImageProperties(imgBase64) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    resolve({ width: img.width, height: img.height });
                };
                img.src = imgBase64;
            });
        }

        loadLaporan();
    </script>
</body>
    </html>
